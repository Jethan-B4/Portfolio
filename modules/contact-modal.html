<!-- Contact Modal -->
<div id="contactModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle" class="modal-title">Send a Message</h2>
      <button type="button" class="modal-close" id="modalClose" aria-label="Close modal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <!--
      TODO: replace YOUR_EMAIL_HERE with your real address (both here and in
      the FORM_ENDPOINT constant in script.js). See index.html / the chat
      reply for how this is wired up.
    -->
    <form
      id="contactForm"
      class="contact-form"
      action="https://formsubmit.co/93cc9484fd303ab92acc509fe96cbd46"
      method="POST"
    >
      <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" class="form-input" required placeholder="Your name">
      </div>
      
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="your.email@example.com">
      </div>
      
      <div class="form-group">
        <label for="subject" class="form-label">Subject</label>
        <input type="text" id="subject" name="subject" class="form-input" required placeholder="Subject of your message">
      </div>
      
      <div class="form-group">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" class="form-textarea" required placeholder="Your message here..." rows="5"></textarea>
      </div>

      <!-- FormSubmit.co config fields: https://formsubmit.co/documentation -->
      <input type="hidden" name="_subject" value="New message from portfolio contact form">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <!--
        Where FormSubmit sends the visitor after a plain (non-AJAX) POST —
        used on file:// pages and as a fallback if fetch() fails elsewhere.
        script.js overwrites this with the real current URL + ?sent=true
        on page load; the empty value here is just a placeholder so the
        field still exists for visitors with JavaScript disabled.
      -->
      <input type="hidden" name="_next" value="">
      <!-- Honeypot: left blank by humans, filled in by most spam bots -->
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

      <div class="form-group form-consent">
        <label class="form-checkbox-label" for="agreeTerms">
          <input type="checkbox" id="agreeTerms" name="agreeTerms" class="form-checkbox" required>
          <span>
            I agree that the information I submit here goes directly to Jethan's
            personal email and is seen only by him — used solely to connect with
            people interested in his work or in potential employment opportunities.
          </span>
        </label>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send Message</button>
        <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
      </div>
    </form>
  </div>
</div>
